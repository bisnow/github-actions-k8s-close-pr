name: 'Cleanup PR Stack'
description: 'Safely cleanup Kubernetes PR stack resources, and CloudFormation stack'

inputs:
  pr-number:
    description: 'Pull request number. Used for the summary and, unless stack-id is set, as the stack identity. Omit for a PR-independent dev stack (pass stack-id instead).'
    required: false
    default: ''
  stack-id:
    description: 'Stable stack identity used to reconstruct the release name (<app>-pr-<stack-id>), pr-number label, and CloudFormation stack name. A PR number ("123") or a dev-stack slug ("dev-authfix"). Defaults to pr-number.'
    required: false
    default: ''
  app-name:
    description: 'Application name (used for resource queries to prevent namespace collisions)'
    required: true
  service-name:
    description: 'Service name (used for CloudFormation verification)'
    required: true
  aws-account:
    description: 'AWS account name for role assumption'
    required: false
    default: 'bisnow'
  namespace:
    description: 'Kubernetes namespace where PR stack is deployed'
    required: true
  cloudformation-stack-prefix:
    description: 'CloudFormation stack name prefix (e.g., "leads-pr" will match "leads-pr123")'
    required: true
  aws-region:
    description: 'AWS region for CloudFormation operations'
    required: false
    default: 'us-east-1'
  eks-cluster-name:
    description: 'EKS cluster name for kubectl configuration'
    required: false
    default: 'bisnow-non-prod-eks'

outputs:
  cleanup-status:
    description: 'Status of cleanup operation'
    value: ${{ steps.final-status.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Assume AWS Role
      uses: bisnow/github-actions-assume-role-for-environment@main
      with:
        aws-account: ${{ inputs.aws-account }}

    - name: Configure kubectl
      shell: bash
      run: |
        aws eks update-kubeconfig --region ${{ inputs.aws-region }} --name ${{ inputs.eks-cluster-name }}

    - name: Resolve stack identity
      shell: bash
      env:
        STACK_ID_INPUT: ${{ inputs.stack-id }}
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # Identity used to reconstruct the release/label/CF-stack names. Defaults
        # to the PR number so existing callers are unchanged; dev stacks pass a
        # non-PR slug via stack-id.
        STACK_ID="${STACK_ID_INPUT:-}"
        if [ -z "${STACK_ID}" ]; then
          STACK_ID="${PR_NUMBER_INPUT:-}"
        fi
        if [ -z "${STACK_ID}" ]; then
          echo "ERROR: one of stack-id or pr-number must be provided."
          exit 1
        fi
        if ! printf '%s' "${STACK_ID}" | grep -qE '^([0-9]+|dev-[a-z0-9][a-z0-9-]*)$'; then
          echo "ERROR: stack identity '${STACK_ID}' must be a PR number or a dev-<slug>."
          exit 1
        fi
        echo "STACK_ID=${STACK_ID}" >> "$GITHUB_ENV"
        echo "Resolved stack identity: ${STACK_ID}"

    - name: Delete PR Stack Helm Release
      id: delete-helm
      shell: bash
      run: |
        RELEASE_SUFFIX="-pr-${STACK_ID}"
        MAX_APP_LEN=$((53 - ${#RELEASE_SUFFIX}))
        APP_NAME="${{ inputs.app-name }}"

        if [ ${#APP_NAME} -gt $MAX_APP_LEN ]; then
          APP_NAME="${APP_NAME:0:$MAX_APP_LEN}"
          echo "Warning: app-name truncated to ${MAX_APP_LEN} chars to fit Helm 53-char release name limit: ${APP_NAME}"
        fi

        RELEASE_NAME="${APP_NAME}${RELEASE_SUFFIX}"
        echo "release-name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
        echo "Deleting Helm release ${RELEASE_NAME}..."

        set +e
        DELETE_OUTPUT=$(helm delete "${RELEASE_NAME}" \
          --namespace ${{ inputs.namespace }} 2>&1)
        DELETE_EXIT=$?
        set -e

        if [ $DELETE_EXIT -ne 0 ]; then
          if echo "$DELETE_OUTPUT" | grep -q "release: not found"; then
            echo "Release not found - already deleted or never deployed"
          else
            echo "ERROR: ${DELETE_OUTPUT}"
            exit $DELETE_EXIT
          fi
        else
          echo "$DELETE_OUTPUT"
        fi

    - name: Verify Kubernetes Resources Cleaned Up
      shell: bash
      run: |
        echo "Verifying all Kubernetes resources are deleted..."
        PODS=$(kubectl get pod -n ${{ inputs.namespace }} \
          -l pr-number=${STACK_ID},app=${{ inputs.app-name }} \
          --no-headers 2>/dev/null | wc -l)

        if [ "$PODS" -eq 0 ]; then
          echo "All pods deleted successfully"
        else
          echo "⚠️  Warning: $PODS pod(s) still exist"
          kubectl get pod -n ${{ inputs.namespace }} \
            -l pr-number=${STACK_ID},app=${{ inputs.app-name }}
        fi

    - name: Verify CloudFormation Stack Before Deletion
      id: verify-stack
      shell: bash
      run: |
        STACK_NAME="${{ inputs.cloudformation-stack-prefix }}${STACK_ID}"
        echo "Verifying CloudFormation stack: $STACK_NAME"

        # Check if stack exists
        if ! aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region ${{ inputs.aws-region }} &>/dev/null; then
          echo "Stack does not exist, nothing to delete"
          echo "stack-exists=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Verify stack name matches a PR (prefix + digits) or dev (prefix + dev-<slug>) pattern
        if [[ ! "$STACK_NAME" =~ ^${{ inputs.cloudformation-stack-prefix }}([0-9]+|dev-[a-z0-9][a-z0-9-]*)$ ]]; then
          echo "ERROR: Stack name doesn't match expected PR/dev pattern: $STACK_NAME"
          echo "ERROR: Expected pattern: ${{ inputs.cloudformation-stack-prefix }}([0-9]+|dev-<slug>)"
          exit 1
        fi

        echo "Stack verified - safe to delete"
        echo "   - Stack Name: $STACK_NAME"
        echo "   - Identity: ${STACK_ID}"
        echo "   - Service: ${{ inputs.service-name }}"
        echo "stack-exists=true" >> $GITHUB_OUTPUT
        echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT

    - name: Delete CloudFormation Stack
      if: steps.verify-stack.outputs.stack-exists == 'true'
      shell: bash
      run: |
        STACK_NAME="${{ steps.verify-stack.outputs.stack-name }}"
        echo "Deleting CloudFormation stack: $STACK_NAME"

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --region ${{ inputs.aws-region }}

        echo "Waiting for stack deletion to complete..."
        aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region ${{ inputs.aws-region }}
        echo "Stack deleted successfully"

    - name: Set Final Status
      id: final-status
      shell: bash
      run: |
        echo "status=success" >> $GITHUB_OUTPUT
        echo "Stack ${STACK_ID} cleanup completed successfully"

    - name: Summary
      shell: bash
      run: |
        echo "## PR Environment Cleaned Up" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Service:** \`${{ inputs.service-name }}\` (\`${{ inputs.app-name }}\`)" >> $GITHUB_STEP_SUMMARY
        echo "**Stack \`${STACK_ID}\`** resources have been deleted:" >> $GITHUB_STEP_SUMMARY
        echo "- Helm release: \`${{ steps.delete-helm.outputs.release-name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- CloudFormation stack: \`${{ inputs.cloudformation-stack-prefix }}${STACK_ID}\`" >> $GITHUB_STEP_SUMMARY
        echo "- All Kubernetes resources removed" >> $GITHUB_STEP_SUMMARY