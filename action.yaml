name: 'Cleanup PR Stack'
description: 'Safely cleanup Kubernetes PR stack resources, and CloudFormation stack'

inputs:
  pr-number:
    description: 'Pull request number. Used for the summary and, unless stack-id is set, as the stack identity. Omit for a PR-independent dev stack (pass stack-id instead).'
    required: false
    default: ''
  stack-id:
    description: 'Stable stack identity used to reconstruct the release name (<app>-pr-<stack-id>), pr-number label, and CloudFormation stack name. A PR number ("123") or a dev-stack slug ("dev-authfix"). Defaults to pr-number.'
    required: false
    default: ''
  app-name:
    description: 'Application name (used for resource queries to prevent namespace collisions)'
    required: true
  service-name:
    description: 'Service name (used for CloudFormation verification)'
    required: true
  aws-account:
    description: 'AWS account name for role assumption'
    required: false
    default: 'bisnow'
  namespace:
    description: 'Kubernetes namespace where PR stack is deployed'
    required: true
  cloudformation-stack-prefix:
    description: 'CloudFormation stack name prefix (e.g., "leads-pr" will match "leads-pr123")'
    required: true
  aws-region:
    description: 'AWS region for CloudFormation operations'
    required: false
    default: 'us-east-1'
  eks-cluster-name:
    description: 'EKS cluster name for kubectl configuration'
    required: false
    default: 'bisnow-non-prod-eks'
  force:
    description: 'Force-delete a stuck/orphaned stack. When "true", after the normal helm delete the action also discovers the ACTUAL release name from the workload labels (app + pr-number) and deletes it, plus any lingering labeled resources — clearing a stack that was deployed under a release name this action cannot reconstruct (the draft/rename orphan). Off by default; the normal path is unchanged.'
    required: false
    default: 'false'

outputs:
  cleanup-status:
    description: 'Status of cleanup operation'
    value: ${{ steps.final-status.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Assume AWS Role
      uses: bisnow/github-actions-assume-role-for-environment@main
      with:
        aws-account: ${{ inputs.aws-account }}

    - name: Configure kubectl
      shell: bash
      run: |
        aws eks update-kubeconfig --region ${{ inputs.aws-region }} --name ${{ inputs.eks-cluster-name }}

    - name: Resolve stack identity
      shell: bash
      env:
        STACK_ID_INPUT: ${{ inputs.stack-id }}
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        # Identity used to reconstruct the release/label/CF-stack names. Defaults
        # to the PR number so existing callers are unchanged; dev stacks pass a
        # non-PR slug via stack-id.
        STACK_ID="${STACK_ID_INPUT:-}"
        if [ -z "${STACK_ID}" ]; then
          STACK_ID="${PR_NUMBER_INPUT:-}"
        fi
        if [ -z "${STACK_ID}" ]; then
          echo "ERROR: one of stack-id or pr-number must be provided."
          exit 1
        fi
        if ! printf '%s' "${STACK_ID}" | grep -qE '^([0-9]+|dev-[a-z0-9][a-z0-9-]*)$'; then
          echo "ERROR: stack identity '${STACK_ID}' must be a PR number or a dev-<slug>."
          exit 1
        fi
        echo "STACK_ID=${STACK_ID}" >> "$GITHUB_ENV"
        echo "Resolved stack identity: ${STACK_ID}"

    - name: Delete PR Stack Helm Release
      id: delete-helm
      shell: bash
      run: |
        RELEASE_SUFFIX="-pr-${STACK_ID}"
        MAX_APP_LEN=$((53 - ${#RELEASE_SUFFIX}))
        APP_NAME="${{ inputs.app-name }}"

        if [ ${#APP_NAME} -gt $MAX_APP_LEN ]; then
          APP_NAME="${APP_NAME:0:$MAX_APP_LEN}"
          echo "Warning: app-name truncated to ${MAX_APP_LEN} chars to fit Helm 53-char release name limit: ${APP_NAME}"
        fi

        RELEASE_NAME="${APP_NAME}${RELEASE_SUFFIX}"
        echo "release-name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
        echo "Deleting Helm release ${RELEASE_NAME}..."

        set +e
        DELETE_OUTPUT=$(helm delete "${RELEASE_NAME}" \
          --namespace ${{ inputs.namespace }} 2>&1)
        DELETE_EXIT=$?
        set -e

        # release-missing records that helm had nothing to delete under the
        # expected name. On its own that's the idempotent case (already torn
        # down). But paired with live pods it means the running stack was
        # deployed under a DIFFERENT release name than we reconstructed — a
        # silent no-op that used to report success. The verify step below cross-
        # checks the two and fails loudly on that mismatch.
        if [ $DELETE_EXIT -ne 0 ]; then
          if echo "$DELETE_OUTPUT" | grep -q "release: not found"; then
            echo "Release not found - already deleted or never deployed"
            echo "release-missing=true" >> $GITHUB_OUTPUT
          else
            echo "ERROR: ${DELETE_OUTPUT}"
            exit $DELETE_EXIT
          fi
        else
          echo "$DELETE_OUTPUT"
          echo "release-missing=false" >> $GITHUB_OUTPUT
        fi

    - name: Force-delete lingering release and resources
      if: inputs.force == 'true'
      shell: bash
      run: |
        set -euo pipefail
        NS="${{ inputs.namespace }}"
        APP="${{ inputs.app-name }}"
        SELECTOR="pr-number=${STACK_ID},app=${APP}"
        echo "Force mode: discovering the ACTUAL release behind ${SELECTOR} in ${NS}..."

        # The helm-chart-pr-stack chart names the workload after the release, so
        # the Deployment/StatefulSet name IS the real release name — even when it
        # differs from the reconstructed <app>-pr-<id> (the draft/rename orphan
        # the normal delete can't reach). Resolve it from the workload labels.
        RELEASES=$(kubectl get deploy,statefulset -n "$NS" -l "$SELECTOR" \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | sort -u | grep -v '^$' || true)

        if [ -n "$RELEASES" ]; then
          while IFS= read -r rel; do
            echo "Force-deleting helm release ${rel}..."
            helm delete "$rel" --namespace "$NS" 2>&1 || echo "  (helm delete ${rel} returned non-zero — continuing)"
          done <<< "$RELEASES"
        else
          echo "No workload found for ${SELECTOR} — nothing to resolve via helm."
        fi

        # Backstop: delete any resources still carrying the stack's labels, so a
        # release whose helm metadata is already gone (but whose objects linger)
        # is also cleared. Scoped tightly by app + pr-number, so it can only touch
        # this stack's objects.
        echo "Sweeping any labeled leftovers for ${SELECTOR}..."
        kubectl delete deploy,statefulset,replicaset,pod,svc,ingress,secret,configmap,pvc,job \
          -n "$NS" -l "$SELECTOR" --ignore-not-found --wait=false 2>&1 || true

    - name: Verify Kubernetes Resources Cleaned Up
      shell: bash
      env:
        RELEASE_MISSING: ${{ steps.delete-helm.outputs.release-missing }}
        RELEASE_NAME: ${{ steps.delete-helm.outputs.release-name }}
      run: |
        set -euo pipefail
        NS="${{ inputs.namespace }}"
        SELECTOR="pr-number=${STACK_ID},app=${{ inputs.app-name }}"

        # helm delete returns immediately; the workload terminates asynchronously.
        # Poll until the app's pods are gone, then assert. A green run must MEAN
        # the stack is gone — the old warn-only check let a failed/no-op teardown
        # report success, which is how draft/renamed stacks became invisible
        # orphans the dashboard couldn't clear.
        echo "Verifying pods for ${SELECTOR} in ${NS} are gone..."
        PODS=0
        for attempt in $(seq 1 18); do   # ~3 min (18 × 10s)
          PODS=$(kubectl get pod -n "$NS" -l "$SELECTOR" --no-headers 2>/dev/null | grep -c . || true)
          if [ "$PODS" -eq 0 ]; then
            echo "All pods deleted successfully"
            break
          fi
          echo "  ${PODS} pod(s) still terminating (attempt ${attempt}/18)..."
          sleep 10
        done

        if [ "$PODS" -ne 0 ]; then
          echo "::error::Teardown incomplete — ${PODS} pod(s) for ${SELECTOR} still running after helm delete."
          kubectl get pod -n "$NS" -l "$SELECTOR" || true
          if [ "${RELEASE_MISSING:-}" = "true" ]; then
            # helm found nothing under RELEASE_NAME, yet the workload is live: the
            # running stack was deployed under a different release name than we
            # reconstructed (the classic draft/rename orphan). Deleting by the
            # expected name can never clear it — a human/force-delete must.
            echo "::error::helm reported '${RELEASE_NAME}' not found, but its pods are live — the stack was deployed under a DIFFERENT release name. Reconstructed identity does not match the live release; force-delete required."
            echo "Live helm releases in ${NS} matching this app:"
            helm list -n "$NS" --all --filter "^${{ inputs.app-name }}-pr-" 2>/dev/null || true
          fi
          exit 1
        fi

    - name: Verify CloudFormation Stack Before Deletion
      id: verify-stack
      shell: bash
      run: |
        STACK_NAME="${{ inputs.cloudformation-stack-prefix }}${STACK_ID}"
        echo "Verifying CloudFormation stack: $STACK_NAME"

        # Check if stack exists
        if ! aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region ${{ inputs.aws-region }} &>/dev/null; then
          echo "Stack does not exist, nothing to delete"
          echo "stack-exists=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Verify stack name matches a PR (prefix + digits) or dev (prefix + dev-<slug>) pattern
        if [[ ! "$STACK_NAME" =~ ^${{ inputs.cloudformation-stack-prefix }}([0-9]+|dev-[a-z0-9][a-z0-9-]*)$ ]]; then
          echo "ERROR: Stack name doesn't match expected PR/dev pattern: $STACK_NAME"
          echo "ERROR: Expected pattern: ${{ inputs.cloudformation-stack-prefix }}([0-9]+|dev-<slug>)"
          exit 1
        fi

        echo "Stack verified - safe to delete"
        echo "   - Stack Name: $STACK_NAME"
        echo "   - Identity: ${STACK_ID}"
        echo "   - Service: ${{ inputs.service-name }}"
        echo "stack-exists=true" >> $GITHUB_OUTPUT
        echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT

    - name: Delete CloudFormation Stack
      if: steps.verify-stack.outputs.stack-exists == 'true'
      shell: bash
      run: |
        STACK_NAME="${{ steps.verify-stack.outputs.stack-name }}"
        echo "Deleting CloudFormation stack: $STACK_NAME"

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --region ${{ inputs.aws-region }}

        echo "Waiting for stack deletion to complete..."
        aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region ${{ inputs.aws-region }}
        echo "Stack deleted successfully"

    - name: Set Final Status
      id: final-status
      shell: bash
      run: |
        echo "status=success" >> $GITHUB_OUTPUT
        echo "Stack ${STACK_ID} cleanup completed successfully"

    - name: Summary
      shell: bash
      run: |
        echo "## PR Environment Cleaned Up" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Service:** \`${{ inputs.service-name }}\` (\`${{ inputs.app-name }}\`)" >> $GITHUB_STEP_SUMMARY
        echo "**Stack \`${STACK_ID}\`** resources have been deleted:" >> $GITHUB_STEP_SUMMARY
        echo "- Helm release: \`${{ steps.delete-helm.outputs.release-name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- CloudFormation stack: \`${{ inputs.cloudformation-stack-prefix }}${STACK_ID}\`" >> $GITHUB_STEP_SUMMARY
        echo "- All Kubernetes resources removed" >> $GITHUB_STEP_SUMMARY